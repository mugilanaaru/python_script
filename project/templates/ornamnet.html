<html>
    <head>
        <title>DEPOSITS</title>
        <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"
    </head>
    <body>
        <h1>Ornaments Details</h1>
        <table>
            <tr>
                <th>ID</th>
                <th>NAME</th>
                <th>Material</th>
                <th>Measurement</th>
                <th>Description</th>
            </tr>
            {% for data in datas %}
                    <td>{{data.ID}}</td>
                    <td>{{data.name}}</td>
                    <td>{{data.material}}</td>
                    <td>{{data.measurement}}</td>
                    <td>{{data.description}}</td>
                    <td><a href="{{url_for('edituser',id=data.ID,table='ornamnet')}}">Edit</a></td>
                    <td><a onclick="return confirm('Are you sure to delete {{data.name}}?');" href="{{url_for('deleteuser',id=data.ID,table='ornamnet')}}">Delete</a></td>
                </tr>
            {% endfor %}    
        </table>

    </body>
</html>
