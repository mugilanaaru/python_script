version: "3.8"

services:
  web:
    build:
      context: .   # adjust if Dockerfile is here
    container_name: flask_app
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./static/uploads:/app/static/uploads

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    env_file:
      - .env        # load MYSQL_ROOT_PASSWORD and MYSQL_DATABASE from here
    ports:
      - "3307:3306"   # avoid conflict with local MySQL
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
